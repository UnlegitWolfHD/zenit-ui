# The repository is not pushed anywhere yet. This workflow is inert until it is:
# GitHub Actions only runs it once the repository has a remote on GitHub.
# Node 24 is the active LTS. Local development ran on Node 25, which builds and
# tests fine but prints engine warnings, because odd-numbered releases never
# enter LTS.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run lint:css

      - run: npm run format:check

      # The derived theme values are checked, not trusted: every scheme times
      # every accent against the contrast rules of docs/theming.md.
      - run: npm run check:themes

      # The example application shows its own source. This fails when the
      # generated copy no longer matches the files.
      - run: npm run check:snippets

      # Library plus the compiled schematics that `ng add` needs.
      - run: npm run build:lib

      - run: npx ng build ui-demo

      # The example application consumes the built package from dist/zenit-ui,
      # so it only builds after the library. `npm run lint` above already
      # covers it, because `ng lint` runs every project with a lint target.
      - run: npx ng build beispiel-app

      - run: npx ng test zenit-ui --watch=false

      - run: npx ng test beispiel-app --watch=false

      - run: npm run test:schematics

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - run: npm run e2e:beispiel

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
