<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  body { margin: 0; padding: 24px; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .demo + .demo { margin-top: 16px; }
  .stack { display: grid; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; color: var(--text-subtle); width: 100%; }
</style>
</head>
<body class="z-root">
<div class="demo" style="align-items:flex-start">
  <button class="z-btn z-btn--ghost z-btn--icon" aria-label="Weitere Aktionen" aria-expanded="true"><span class="material-icons z-icon" aria-hidden="true">more_vert</span></button>
  <div class="z-menu" role="menu">
    <button class="z-menu__item" role="menuitem"><span class="material-icons z-icon" aria-hidden="true">content_copy</span>Adresse kopieren</button>
    <button class="z-menu__item" role="menuitem"><span class="material-icons z-icon" aria-hidden="true">folder</span>FTP-Zugang</button>
    <button class="z-menu__item" role="menuitem"><span class="material-icons z-icon" aria-hidden="true">group_add</span>Zugriff teilen</button>
    <div class="z-menu__sep" role="separator"></div>
    <button class="z-menu__item z-menu__item--danger" role="menuitem"><span class="material-icons z-icon" aria-hidden="true">power_settings_new</span>Hart beenden</button>
    <button class="z-menu__item z-menu__item--danger" role="menuitem"><span class="material-icons z-icon" aria-hidden="true">delete</span>Server löschen</button>
  </div>
</div>
</body>
</html>
