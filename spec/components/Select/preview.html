<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  body { margin: 0; padding: 24px; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .demo + .demo { margin-top: 16px; }
  .stack { display: grid; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; color: var(--text-subtle); width: 100%; }
</style>
</head>
<body class="z-root">
<div class="demo">
  <label class="z-field" style="width:180px"><span class="z-field__label">Status</span>
    <span class="z-select"><select id="sel-status"><option>Alle Status</option><option>Online</option><option>Gestoppt</option><option>Fehlgeschlagen</option></select></span></label>
  <label class="z-field" style="width:180px"><span class="z-field__label">Spiel</span>
    <span class="z-select"><select id="sel-game"><option>Alle Spiele</option><option>Minecraft</option><option>Counter-Strike 2</option></select></span></label>
  <label class="z-field" style="width:180px"><span class="z-field__label">Sortierung</span>
    <span class="z-select z-select--sm"><select id="sel-sort"><option>Name</option><option>Kosten</option><option>Status</option></select></span></label>
</div>
</body>
</html>
