<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  body { margin: 0; padding: 24px; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .demo + .demo { margin-top: 16px; }
  .stack { display: grid; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; color: var(--text-subtle); width: 100%; }
</style>
</head>
<body class="z-root">
<div class="z-panel" aria-busy="true" aria-label="Server werden geladen">
  <div class="z-panel__header"><h3 class="z-panel__title">Meine Server</h3></div>
  <div class="z-rows">
    <div class="z-row" style="cursor:default"><div class="z-row__main"><span class="z-skel z-skel--thumb"></span><div style="display:grid;gap:8px;flex:1"><span class="z-skel" style="width:40%"></span><span class="z-skel" style="width:60%"></span></div></div><span class="z-skel" style="width:64px"></span><span class="z-skel" style="width:70%"></span><span class="z-skel" style="width:48px;justify-self:end"></span><span></span></div>
    <div class="z-row" style="cursor:default"><div class="z-row__main"><span class="z-skel z-skel--thumb"></span><div style="display:grid;gap:8px;flex:1"><span class="z-skel" style="width:30%"></span><span class="z-skel" style="width:50%"></span></div></div><span class="z-skel" style="width:64px"></span><span class="z-skel" style="width:70%"></span><span class="z-skel" style="width:48px;justify-self:end"></span><span></span></div>
  </div>
</div>
</body>
</html>
