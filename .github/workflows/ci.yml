# The repository is not pushed anywhere yet. This workflow is inert until it is:
# GitHub Actions only runs it once the repository has a remote on GitHub.
# Node 24 is the active LTS. Local development ran on Node 25, which builds and
# tests fine but prints engine warnings, because odd-numbered releases never
# enter LTS.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Windows, because of the screenshots. The reference images in
    # e2e/screenshots were recorded on Windows and their path carries no
    # platform (snapshotPathTemplate in the three Playwright configs), while
    # the comparison runs with zero tolerance. Chromium renders text
    # differently on Linux, so an ubuntu runner would fail every screenshot
    # test against baselines it has no way to match. Recording a second set on
    # Linux is the alternative; it needs a Linux machine to record on, which
    # this project does not have, so inventing those images here would be a
    # guess. Until then the job runs on the one platform that has baselines.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run lint:css

      - run: npm run format:check

      # The derived theme values are checked, not trusted: every scheme times
      # every accent against the contrast rules of docs/theming.md.
      - run: npm run check:themes

      # The example application shows its own source. This fails when the
      # generated copy no longer matches the files.
      - run: npm run check:snippets

      # Source scan: nothing that is evaluated at load time may reference a class
      # that the same file declares further down, and no import cycles.
      - run: npm run check:order

      # Library plus the compiled schematics that `ng add` needs.
      - run: npm run build:lib

      # The built bundle has to load in plain Node with the JIT compiler, the way
      # a consumer whose unit tests run with `aot: false` loads it. AOT builds and
      # the library's own tests never evaluate the partial declarations like that.
      - run: npm run check:bundle

      - run: npx ng build ui-demo

      # The example application consumes the built package from dist/zenit-ui,
      # so it only builds after the library. `npm run lint` above already
      # covers it, because `ng lint` runs every project with a lint target.
      - run: npx ng build beispiel-app

      - run: npx ng test zenit-ui --watch=false

      - run: npx ng test beispiel-app --watch=false

      # The same specs the way an installed consumer runs them: zenit-ui stays
      # outside the test bundle, so no linker touches it and the JIT compiler
      # compiles its partial declarations while the module loads.
      - run: npm run test:beispiel:jit

      - run: npm run test:schematics

      # No --with-deps: installing system dependencies is an Ubuntu-only step
      # and fails on a Windows runner, which needs none.
      - run: npx playwright install chromium

      - run: npm run e2e

      - run: npm run e2e:beispiel

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
