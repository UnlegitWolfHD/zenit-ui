<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  body { margin: 0; padding: 24px; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .demo + .demo { margin-top: 16px; }
  .stack { display: grid; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; color: var(--text-subtle); width: 100%; }
</style>
</head>
<body class="z-root">
<div class="demo">
  <span class="z-badge z-badge--success"><span class="z-badge__dot"></span>Online</span>
  <span class="z-badge z-badge--danger"><span class="z-badge__dot"></span>Fehlgeschlagen</span>
  <span class="z-badge z-badge--warning"><span class="z-badge__dot"></span>Neustart läuft</span>
  <span class="z-badge"><span class="z-badge__dot"></span>Gestoppt</span>
  <span class="z-badge z-badge--info">Geplant</span>
</div>
<div class="demo">
  <span class="cap">Neutrale Tags: Tarif, Loader, Rechte, Kategorie</span>
  <span class="z-badge">Flex, nach Stunden</span>
  <span class="z-badge">PaperMC</span>
  <span class="z-badge">Geteilt</span>
  <span class="z-badge">Konsole</span>
  <span class="z-badge">Subdomain</span>
</div>
</body>
</html>
